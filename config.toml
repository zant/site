baseURL = "https://www.zantwi.ch"
languageCode = "en-us"
title = "zant's dump"
theme = "etch"
[params]
mainSections = ['posts']
secondarySections = ['projects']
custom_css = ["css/main.css"]
[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    noHl = false
    style = 'dracula'
    tabWidth = 4
